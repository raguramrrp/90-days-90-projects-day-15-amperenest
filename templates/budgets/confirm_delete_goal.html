{% extends 'base.html' %}
{% block page_title %}Delete Energy Goal{% endblock %}

{% block content %}
<div style="max-width: 500px;">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Confirm Goal Deletion</span>
    </div>
    <div class="card-body">
      <p style="font-size: 13.5px; margin-bottom: 14px;">
        Are you sure you want to delete goal "<strong>{{ goal.title }}</strong>"?
      </p>
      <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-danger">Confirm Delete</button>
          <a href="{% url 'budgets:dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
