{% extends 'base.html' %}
{% block page_title %}Remove Appliance{% endblock %}

{% block content %}
<div style="max-width: 500px;">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Confirm Appliance Removal</span>
    </div>
    <div class="card-body">
      <p style="font-size: 13.5px; margin-bottom: 14px;">
        Are you sure you want to remove <strong>{{ appliance.name }}</strong> ({{ appliance.rated_power_watts }}W) from the household inventory?
      </p>
      <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-danger">Remove from Inventory</button>
          <a href="{% url 'appliances:list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
